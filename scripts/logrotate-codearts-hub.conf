# codearts-hub 网关日志轮转（systemd append 模式配套，copytruncate 不打断写入 fd）
# 安装：sudo cp scripts/logrotate-codearts-hub.conf /etc/logrotate.d/codearts-hub
# 路径按实际部署调整（默认与 deploy-full.sh 的 WB_DEPLOY_DIR 一致）。
/home/ubuntu/codearts-hub/logs/gw.log {
    weekly
    rotate 4
    size 16M
    missingok
    notifempty
    compress
    delaycompress
    copytruncate
}

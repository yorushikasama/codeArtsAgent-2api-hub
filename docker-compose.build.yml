# 本地源码构建（开发者 / 修改代码测试用）：
#   docker compose -f docker-compose.build.yml up -d --build
services:
  codearts-hub:
    build: .
    image: codearts-hub:local
    container_name: codearts-hub
    restart: unless-stopped
    # 同 docker-compose.yml：给收尾留出超过 docker 默认 10 秒 SIGKILL 的窗口。
    stop_grace_period: 30s
    ports:
      - "8788:8788"
    environment:
      - HOST=0.0.0.0
      - PORT=8788
      # - API_KEY=your_secret_key
      - TZ=Asia/Shanghai
    volumes:
      - ./accounts:/app/accounts
      - ./usage:/app/usage

    '传输类失败与 502/503/504 改记在「出口」而不是账号上：同一个出口的账号共用一个计数器，退避是秒级（1 秒起、翻倍、封顶 15 秒、带抖动），任一次成功即清零；账号级熔断（30 分钟起、翻倍到 6 小时）不再被一次链路抖动触发。500 与 401/403/429 仍走原路径。默认关闭。': 'Transport failures and 502/503/504 are charged to the egress instead of the account: accounts sharing one egress share one counter, the backoff is seconds-scale (1s, doubling, capped at 15s, jittered) and any success clears it; the account breaker (30 minutes, doubling to 6h) is no longer tripped by a link hiccup. 500 and 401/403/429 keep their old paths. Off by default.',

    '上游响应头超时': 'Upstream response-header timeout',
    '单次尝试等上游返回响应头的上限（秒）。拿到响应头之前网关不会向客户端发出任何字节，所以这个值就是客户端要空等的时长：设得比客户端的首字节预算还大时，客户端会先断开（表现为 499 / 首字节迟迟不返回），而网关仍会按这个上限继续换账号重试。默认 120。': 'How long one attempt may wait for the upstream to send response headers (seconds). Nothing is sent to the client before those headers arrive, so this is exactly how long the client can end up waiting: set it above the client\'s first-byte budget and the client disconnects first (seen as a 499, or a first byte that never comes) while the gateway keeps retrying on the next account under the same limit. Default 120.',
    '调小的代价：上游偶尔确实算得慢的正常请求会被提前判失败、换账号重试，多消耗一次额度。建议不高于客户端的首字节预算。': 'The cost of lowering it: a normal request the upstream genuinely takes a long time to compute is failed early and retried on another account, spending one more unit of quota. Prefer a value no higher than the client\'s first-byte budget.',

    if(node.__wbOut === cur) return;
    node.__wbSrc = cur;
    if(!HAN.test(cur)) return;
    var out;
    if(lang === 'en') out = translate(cur.replace(WS, ' '));
    else if(lang === 'zh-Hant') out = translateHant(cur.replace(WS, ' '));
    else return;
    if(out === cur) return;
    node.__wbOut = out;
    node.data = out;
  }
  function doAttrs(el){
    // 整树 walk 时绝大多数元素没有任何一个 ATTRS 里的属性；先问一次"有没有属性"
    // 再进循环，省下每个元素 5 次 hasAttribute 的固定开销（profile 里排名靠前）。
    if(!el.hasAttributes()) return;
    for(var i = 0; i < ATTRS.length; i++){
      var a = ATTRS[i];
      if(!el.hasAttribute(a)) continue;
      var cur = el.getAttribute(a);
      var store = el.__wbAttr || (el.__wbAttr = {});
      var slot = a + '|out';
      if(store[slot] === cur) continue;
      store[a] = cur;
      if(!HAN.test(cur)) continue;
      var out;
      if(lang === 'en') out = translate(cur.replace(WS, ' '));
      else if(lang === 'zh-Hant') out = translateHant(cur.replace(WS, ' '));
      else continue;
      if(out === cur) continue;
      store[slot] = out;
      el.setAttribute(a, out);
    }
  }
  function walk(node){
    if(node.nodeType === 3){
      if(node.parentNode && allowed(node.parentNode)) doText(node);
      return;
    }
    if(node.nodeType !== 1 || !allowed(node)) return;
    doAttrs(node);
    var kids = node.childNodes;
    for(var i = 0; i < kids.length; i++) walk(kids[i]);
  }
  function restore(node){
    if(node.nodeType === 3){
      if(node.__wbSrc != null && node.data !== node.__wbSrc){
        node.__wbOut = null;
        node.data = node.__wbSrc;
      }
      return;
    }
    if(node.nodeType !== 1) return;
    var store = node.__wbAttr;
    if(store){
      for(var i = 0; i < ATTRS.length; i++){
        var a = ATTRS[i];
        if(store[a] != null && node.getAttribute(a) !== store[a]){
          store[a + '|out'] = null;
          node.setAttribute(a, store[a]);
        }
      }
    }
    var kids = node.childNodes;
    for(var j = 0; j < kids.length; j++) restore(kids[j]);
  }
  var mo = null;
  function observeOn(){
    if(mo || typeof MutationObserver === 'undefined') return;
    mo = new MutationObserver(function(records){
      if(lang === 'zh') return;
      for(var i = 0; i < records.length; i++){
        var rec = records[i];
        if(rec.type === 'childList'){
          for(var j = 0; j < rec.addedNodes.length; j++) walk(rec.addedNodes[j]);
        } else if(rec.type === 'characterData'){
          if(rec.target.parentNode && allowed(rec.target.parentNode)) doText(rec.target);
        } else {
          doAttrs(rec.target);
        }
      }
    });
    mo.observe(document.documentElement, {childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ATTRS});
  }
  function observeOff(){ if(mo){ mo.disconnect(); mo = null; } }
  function syncButtons(){
    var lbl = document.getElementById('langToggleLabel');
    var btn = document.getElementById('langToggleBtn');
    if(lbl) lbl.textContent = (lang === 'en') ? '简' : (lang === 'zh-Hant' ? 'EN' : '繁');
    if(btn) btn.title = (lang === 'en')
      ? 'Switch language: English → 简体中文'
      : (lang === 'zh-Hant' ? '切換語言：正體中文（台灣） → English' : '切换语言：简体中文 → 正體中文（台灣）');
    var zh = document.getElementById('langOptZh');
    var hant = document.getElementById('langOptHant');
    var en = document.getElementById('langOptEn');
    if(zh && zh.classList && zh.classList.toggle) zh.classList.toggle('active', lang === 'zh');
    if(hant && hant.classList && hant.classList.toggle) hant.classList.toggle('active', lang === 'zh-Hant');
    if(en && en.classList && en.classList.toggle) en.classList.toggle('active', lang === 'en');
  }
  function setLang(next){
    lang = (next === 'en' || next === 'zh-Hant') ? next : 'zh';
    try { localStorage.setItem(LANG_KEY, lang); } catch(e){}
    document.documentElement.setAttribute('data-lang', lang);
    document.documentElement.setAttribute('lang', lang === 'en' ? 'en' : (lang === 'zh-Hant' ? 'zh-Hant-TW' : 'zh-CN'));
    observeOff();
    if(lang === 'en' || lang === 'zh-Hant'){ restore(document.documentElement); walk(document.documentElement); observeOn(); }
    else { restore(document.documentElement); }
    syncButtons();
  }
  window.selectLang = function(next, evt){
    if(evt){ evt.preventDefault(); evt.stopPropagation(); }
    setLang(next);
  };
  window.toggleLang = function(evt){
    if(evt){ evt.preventDefault(); evt.stopPropagation(); }
    setLang(lang === 'zh' ? 'zh-Hant' : (lang === 'zh-Hant' ? 'en' : 'zh'));
  };
  window.WB_I18N = {
    translate: translate,
    translateHant: translateHant,
    current: function(){ return lang; },
    set: setLang,
    apply: function(){ if(lang !== 'zh') walk(document.documentElement); }
  };
  var nativeConfirm = window.confirm;
  var nativeAlert = window.alert;
  window.confirm = function(msg){ return nativeConfirm.call(window, lang === 'en' ? translate(msg) : (lang === 'zh-Hant' ? translateHant(msg) : msg)); };
  window.alert = function(msg){ return nativeAlert.call(window, lang === 'en' ? translate(msg) : (lang === 'zh-Hant' ? translateHant(msg) : msg)); };
  document.documentElement.setAttribute('data-lang', lang);
  document.documentElement.setAttribute('lang', lang === 'en' ? 'en' : (lang === 'zh-Hant' ? 'zh-Hant-TW' : 'zh-CN'));
  function boot(){
    syncButtons();
    if(lang !== 'zh'){ walk(document.documentElement); observeOn(); }
  }
  if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
</script>

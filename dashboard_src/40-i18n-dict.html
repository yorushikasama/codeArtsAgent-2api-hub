    if(!BY_FIRST[c]) BY_FIRST[c] = [];
    BY_FIRST[c].push(k);
  });

    var bucket = BY_FIRST[text.charAt(i)];
    if(!bucket) return null;
    for(var j = 0; j < bucket.length; j++){
      var k = bucket[j];
      if(text.substr(i, k.length) === k) return k;
    }
    return null;

  var ALLOWED_CACHE = (typeof WeakMap === 'function') ? new WeakMap() : null;
